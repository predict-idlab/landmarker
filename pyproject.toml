[project]
name = "landmarker"
dynamic = ["version"]
description = "A PyTorch-based toolkit for (anatomical) landmark detection in images."
authors = [
    {name = "Jef Jonkers", email = "jef.jonkers@ugent.be"},
]
dependencies = [
    "opencv-python-headless>=4.8.1.78",
    "monai>=1.5.0",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "tqdm>=4.66.1",
    "numpy>=1.24.4",
    "pandas>=2.3.3",
    "rarfile>=4.1",
    "scipy>=1.15.0,<1.16.0; python_version < '3.14'",
    "scipy>=1.16.1,<1.17.0; python_version >= '3.14'",
    "pydicom>=2.4.3",
    "matplotlib>=3.7.4",
    "seaborn>=0.13.0",
    "scikit-image>=0.21.0",
    "pillow>=12.0.0",
    "greenlet>=3.2.4",
    "pyzmq>=27.1.0",
    "typing-extensions>=4.15.0",
]
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = {text = "MIT"}

[tool.hatch.version]
path = "src/landmarker/__init__.py"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/landmarker",
    "/tests",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/tox.ini",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
]
lint = [
    "flake8",
    "black",
]
doc = [
    "sphinx>=7.1.2",
    "sphinx-autobuild",
    "sphinxext-opengraph",
    "sphinx-copybutton",
    "myst-parser",
    "sphinx_design",
    "furo",
    "myst-nb",
    "sphinx-togglebutton",
    "sphinx-collections",
    "GitPython"
]
type = [
    "mypy>=1.7.1",
]
tox = [
    "tox>=4",
    "tox-uv>=1.36,<2",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "doc"},
    {include-group = "type"},
    {include-group = "tox"},
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning"
]
testpaths = [
    "tests/",
]
addopts = ["--cov=src/landmarker", "--cov-report=term-missing", "--cov-report=xml"]

[tool.coverage.run]
omit = ["*/datasets/*"]

[tool.mypy]
exclude = "tests/"


[tool.black]
line-length = 100
include = "src/landmarker"

[tool.isort]
profile = "black"
atomic = true
filter_files = true
