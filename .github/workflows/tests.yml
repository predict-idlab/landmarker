name: Tests

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 libopenblas-dev libzmq3-dev

      - name: Install locked test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Test with pytest
        run: uv run --no-sync pytest --junitxml=junit/test-results-${{ matrix.python-version }}.xml
