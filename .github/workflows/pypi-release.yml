# This workflow builds and publishes the package when a release is created.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set Python 3.14
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.14"

      - name: Build package distributions
        run: uv build --no-sources

      - name: Smoke-test wheel
        run: |
          uv venv "${RUNNER_TEMP}/landmarker-wheel-smoke"
          uv pip install --python "${RUNNER_TEMP}/landmarker-wheel-smoke/bin/python" --no-deps dist/*.whl
          "${RUNNER_TEMP}/landmarker-wheel-smoke/bin/python" -c "import landmarker; print(landmarker.__version__)"

      - name: Smoke-test source distribution
        run: |
          uv venv "${RUNNER_TEMP}/landmarker-sdist-smoke"
          uv pip install --python "${RUNNER_TEMP}/landmarker-sdist-smoke/bin/python" --no-deps dist/*.tar.gz
          "${RUNNER_TEMP}/landmarker-sdist-smoke/bin/python" -c "import landmarker; print(landmarker.__version__)"

      - name: Validate package publication
        run: uv publish --dry-run --trusted-publishing never

      - name: Publish package distributions to PyPI
        run: uv publish --trusted-publishing always
